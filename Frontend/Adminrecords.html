<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astik GatePass – Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="adminrecords.css" />
</head>
<body>
  <div class="layout">

    <aside class="sidebar">
      <div class="brand">
        <img src="https://www.adnu.edu.ph/wp-content/uploads/2014/03/AdNU-Seal-1.png"
             alt="Ateneo de Naga University seal" />
        <span>Astik GatePass</span>
      </div>

      <nav class="nav">
        <a href="admindashboard.html" class="nav-btn">Dashboard</a>
        <a href="adminapplicants.html" class="nav-btn">Applicants</a>
        <a href="adminrecords.html" class="nav-btn active">Records</a>
      </nav>

      <a href="#" class="signout">Signout</a>
    </aside>

    <main class="main">
      <h1>Records</h1>

      <div class="toolbar">
        <div class="search">
          <input type="text" placeholder="Search Records" aria-label="Search records" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
        </div>

        <select class="category" aria-label="Category">
          <option>Category</option>
          <option>Student</option>
          <option>Faculty</option>
        </select>
      </div>

      <section class="records-card">
        <div class="list">
          <div class="record">
            <span class="name">NAME</span>
            <span class="type">Student</span>
            <button class="view">View</button>
          </div>

          <div class="record">
            <span class="name">NAME</span>
            <span class="type">Student</span>
            <button class="view">View</button>
          </div>

          <div class="record">
            <span class="name">NAME</span>
            <span class="type">Faculty</span>
            <button class="view">View</button>
          </div>

          <div class="record">
            <span class="name">NAME</span>
            <span class="type">Faculty</span>
            <button class="view">View</button>
          </div>

          <div class="record">
            <span class="name">NAME</span>
            <span class="type">Student</span>
            <button class="view">View</button>
          </div>

          <div class="record">
            <span class="name">NAME</span>
            <span class="type">Student</span>
            <button class="view">View</button>
          </div>

          <div class="record">
            <span class="name">NAME</span>
            <span class="type">Faculty</span>
            <button class="view">View</button>
          </div>

          <div class="record">
            <span class="name">NAME</span>
            <span class="type">Faculty</span>
            <button class="view">View</button>
          </div>

        </div>
      </section>
    </main>

  </div>
</body>
</html>
