<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astik GatePass – Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admindashboard.css" />
</head>
<body>
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <img src="https://www.adnu.edu.ph/wp-content/uploads/2014/03/AdNU-Seal-1.png"
             alt="Ateneo de Naga University seal" />
        <span>Astik GatePass</span>
      </div>

      <nav class="nav">
        <a href="#" class="nav-btn active">Dashboard</a>
        <a href="#" class="nav-btn">Applicants</a>
        <a href="#" class="nav-btn">Records</a>
      </nav>

      <a href="#" class="signout">Signout</a>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <h1>Dashboard</h1>

        <div class="profile">
          <div class="profile-text">
            <strong>Name</strong>
            <span>Administrator</span>
          </div>
          <div class="avatar"></div>
        </div>
      </header>

      <section class="stats">
        <div class="stat">
          <div class="stat-text">
            <h2>Pending</h2>
            <p>0</p>
          </div>
          <svg class="icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="21" />
            <path d="M24 12v12l7 6" />
          </svg>
        </div>

        <div class="stat">
          <div class="stat-text">
            <h2>Approved</h2>
            <p>0</p>
          </div>
          <svg class="icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="21" />
            <path d="M14 25l7 7 13-14" />
          </svg>
        </div>

        <div class="stat stat-total">
          <div class="stat-text">
            <h2>Total Applicants</h2>
            <p>0</p>
          </div>
        </div>
      </section>

      <section class="activity">
        <h3>Recent Activity</h3>
        <!-- Activity items go here -->
      </section>
    </main>

  </div>
</body>
</html>
